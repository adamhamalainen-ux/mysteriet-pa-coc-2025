<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<title>Julkalender</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="calendar-wrapper">
<!-- Själva kalendern med 24 klickbara rutor -->
<div class="calendar-grid">
<div class="door" data-video="film1.mp4">1</div>
<div class="door" data-video="film2.mp4">2</div>
<div class="door" data-video="film3.mp4">3</div>
<div class="door" data-video="film4.mp4">4</div>
<div class="door" data-video="film5.mp4">5</div>
<div class="door" data-video="film6.mp4">6</div>
<div class="door" data-video="film7.mp4">7</div>
<div class="door" data-video="film8.mp4">8</div>
<div class="door" data-video="film9.mp4">9</div>
<div class="door" data-video="film10.mp4">10</div>
<div class="door" data-video="film11.mp4">11</div>
<div class="door" data-video="film12.mp4">12</div>
 
    <!-- Lucka 13: formulär istället för video -->
<div class="door" id="door-13">13</div>
 
    <div class="door" data-video="film14.mp4">14</div>
<div class="door" data-video="film15.mp4">15</div>
<div class="door" data-video="film16.mp4">16</div>
<div class="door" data-video="film17.mp4">17</div>
<div class="door" data-video="film18.mp4">18</div>
<div class="door" data-video="film19.mp4">19</div>
<div class="door" data-video="film20.mp4">20</div>
<div class="door" data-video="film21.mp4">21</div>
<div class="door" data-video="film22.mp4">22</div>
<div class="door" data-video="film23.mp4">23</div>
<div class="door" data-video="film24.mp4">24</div>
</div>
</div>
 
<!-- Modal / pop-up för videon -->
<div class="modal hidden" id="videoModal">
<div class="modal-backdrop"></div>
<div class="modal-content">
<button class="close-btn" id="closeModal">×</button>
<video id="modalVideo" controls></video>
</div>
</div>
 
<!-- Modal / pop-up för lucka 13 formulär -->
<div class="modal hidden" id="formModal13">
<div class="modal-backdrop"></div>
<div class="modal-content">
<button class="close-btn" id="closeForm13">×</button>
<h2>Vem har tagit NAV-skylten?</h2>
<p>Gissa vem det är!</p>
 
    <!-- ⭐ FORMULAR MED FORMSPREE ⭐ -->
<form id="guessForm13" 
          action="https://formspree.io/f/meoypgnj" 
          method="POST" 
          style="max-width:400px;">
 
      <label for="guess13">Vem tror du det är?</label><br>
<input type="text" id="guess13" name="guess" required 
             style="width:100%; margin-bottom:10px;">
 
      <label for="name13">Ditt namn:</label><br>
<input type="text" id="name13" name="name" required 
             style="width:100%; margin-bottom:15px;">
 
      <button type="submit">Skicka in</button>
</form>
 
    <p id="resultMessage13" style="margin-top:15px; font-weight:bold;"></p>
</div>
</div>
 
<script src="script.js"></script>
 
<script>
  // Lucka 13 - öppna formulärmodal
  const door13 = document.getElementById("door-13");
  const formModal13 = document.getElementById("formModal13");
  const closeForm13 = document.getElementById("closeForm13");
 
  door13.addEventListener("click", () => {
    formModal13.classList.remove("hidden");
  });
 
  closeForm13.addEventListener("click", () => {
    formModal13.classList.add("hidden");
  });
 
  // Tackmeddelande efter Formspree-submit
  document.getElementById("guessForm13").addEventListener("submit", function() {
    document.getElementById("resultMessage13").textContent =
      "Tack! Din gissning har skickats in.";
  });
</script>
 
</body>
</html>
